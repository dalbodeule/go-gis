services:
  postgis:
    image: imresamu/postgis:18-3.6.1-alpine3.22
    platform: linux/amd64
    environment:
      POSTGRES_DB: gogis
      POSTGRES_USER: gogis
      POSTGRES_PASSWORD: gogis
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogis -d gogis"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gogis-postgis-data:/var/lib/postgresql/data

volumes:
  gogis-postgis-data:
